spring:
  profiles:
    active: dev
  datasource:
    driverClassName: org.h2.Driver
    url: jdbc:h2:file:./dbNew
    username:
    password:
  h2:
    console:
      enabled: true
      #settings:
      #  web-allow-others: true
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true # Equivalent to spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
  main:
    allow-bean-definition-overriding: true

server:
  port: 8080

management:
  server:
    port: 9001
    address: 127.0.0.1

logging:
  level:
    org:
      hibernate:
        SQL: DEBUG
        type: TRACE # Equivalent to logging.level.org.hibernate.type=TRACE

# Custom Properties (Note: YAML structure uses indentation for hierarchy)
sping-boot-test-aplication:
  http:
    auth-token-header-name: Auth-Key
    auth-token: 123456789