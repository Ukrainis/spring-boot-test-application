plugins {
    id 'org.springframework.boot' version '3.5.7'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'java'
    id 'maven-publish'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

ext {
    lombokVersion = '1.18.30'
    swaggerVersion = '1.6.9'
    xmlSupportVersion = '2.13.3'
}


bootJar {

    //amed('spring-boot-test-app')
    version('0.1.0')
}

jar {
    enabled(false)
}

springBoot {
    mainClass = 'com.example.demo.DemoApplication'
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation group: 'io.jsonwebtoken', name: 'jjwt-api', version: '0.11.2'
    implementation group: 'io.jsonwebtoken', name: 'jjwt-impl', version: '0.11.2'
    implementation group: 'io.jsonwebtoken', name: 'jjwt-jackson', version: '0.11.2'
    implementation 'org.projectlombok:lombok:1.18.24'
    compileOnly 'com.fasterxml.jackson.dataformat:jackson-dataformat-xml:2.13.3'
    runtimeOnly 'com.h2database:h2:2.1.214'
    runtimeOnly 'org.postgresql:postgresql'

    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"

    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // https://mvnrepository.com/artifact/org.wiremock/wiremock
    //testImplementation("org.wiremock:wiremock:3.13.1")
    // https://mvnrepository.com/artifact/org.wiremock/wiremock-standalone
    testImplementation("org.wiremock:wiremock-standalone:3.13.1")
    // https://mvnrepository.com/artifact/org.wiremock/wiremock-jetty12
    //compileOnly("org.wiremock:wiremock-jetty12:3.13.1")
    implementation "org.springdoc:springdoc-openapi-ui:${swaggerVersion}"
    // https://mvnrepository.com/artifact/io.rest-assured/rest-assured
    testImplementation ('io.rest-assured:rest-assured:5.1.1')
    // https://mvnrepository.com/artifact/org.apache.groovy/groovy
    compileOnly("org.apache.groovy:groovy:5.0.2")
    testImplementation 'org.hamcrest:hamcrest:2.2'

}

tasks.named('test') {
    useJUnitPlatform()
}
